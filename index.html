<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>テスト商品A｜セールスレター（連携テスト用）</title>
<style>
  :root { --ink:#1a1a1a; --sub:#5f6368; --line:#e3e3e3; --bg:#fafaf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; line-height:1.8; }
  main { max-width:640px; margin:0 auto; padding:40px 16px 64px; }
  .tag { display:inline-block; font-size:12px; color:var(--sub); border:1px solid var(--line); border-radius:4px; padding:2px 8px; background:#fff; }
  h1 { font-size:26px; line-height:1.4; margin:12px 0 8px; }
  p { margin:0 0 14px; }
  .box { background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px; margin:24px 0; }
  .price { font-size:28px; font-weight:700; }
  .btn { display:block; text-align:center; background:#1a1a1a; color:#fff; text-decoration:none; font-weight:700; font-size:17px; padding:16px; border-radius:8px; }
  .note { font-size:12px; color:var(--sub); margin-top:10px; }
</style>
</head>
<body>
<main>
  <span class="tag">連携テスト用のページ（別ドメイン）</span>
  <h1>テスト商品A</h1>
  <p>このページは、紹介センター（asp.members-room.com）とは別のドメインに置いた、セールスレターの見本です。</p>
  <p>紹介リンクから来た人が、このページの「購入する」ボタンから買ったときに、紹介の成果が付くかを確かめます。</p>

  <div class="box">
    <div>お支払い金額</div>
    <div class="price">1,000円（税込）</div>
  </div>

  <a class="btn" href="https://asp.members-room.com/p/test-product-a/checkout">購入する</a>
  <p class="note">ボタンを押すと、紹介センターの購入手続き（asp.members-room.com）に進みます。今はテストモードなので、本物のお金は動きません。</p>
</main>
</body>
</html>
